<meta charset="utf-8" />

<title>Thanks — Zoe will be in touch | Food Envy</title>
<meta name="description" content="Thanks for sending Zoe your date. She'll be in touch within one working day." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@300;400;500;600;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --fe-black:#000000;
    --fe-green:#05B085;
    --fe-beige:#F1EAE0;
    --fe-white:#FFFFFF;
    --fe-ink:#1a1a1a;
    --fe-mute:#5a5a5a;
  }
  *,*::before,*::after{box-sizing:border-box}
  body{
    margin:0;
    font-family:'Work Sans', system-ui, sans-serif;
    font-weight:300;
    color:var(--fe-ink);
    background:var(--fe-beige);
    line-height:1.6;
    font-size:17px;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 24px;
  }
  .card{
    background:var(--fe-white);
    max-width:560px;
    width:100%;
    padding:clamp(40px, 6vw, 64px);
    text-align:center;
    border-top:4px solid var(--fe-green);
  }
  .eyebrow{
    display:inline-block;
    font-size:12px;
    letter-spacing:.18em;
    text-transform:uppercase;
    font-weight:600;
    color:var(--fe-green);
    margin-bottom:18px;
  }
  h1{
    font-size:clamp(32px, 5vw, 44px);
    font-weight:800;
    letter-spacing:-.02em;
    line-height:1.1;
    margin:0 0 20px;
  }
  p{margin:0 0 18px}
  .muted{color:var(--fe-mute);font-size:15px}
  .btn{
    display:inline-block;
    margin-top:12px;
    padding:14px 28px;
    background:var(--fe-black);
    color:var(--fe-white);
    text-decoration:none;
    font-weight:600;
    letter-spacing:.04em;
    font-size:14px;
    text-transform:uppercase;
  }
</style>
</head>
<body>

  <div class="card">
    <span class="eyebrow">Sent</span>
    <h1>Zoe has your details.</h1>
    <p>She'll be in touch within one working day with availability and a tailored next step. Replies come directly from Zoe (not an auto-responder).</p>
    <p class="muted">If your date is urgent, you can also reach Zoe at events@foodenvy.nz or (04) 242 0080.</p>
    <a href="/" class="btn">Back to the site</a>
  </div>
</body>
